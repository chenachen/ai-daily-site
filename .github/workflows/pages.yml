# That repository contains generated dist/** and this workflow ONLY.
name: Deploy generated public AI brief
on:
  push:
    paths: ['dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Confirm generated payload exists
        run: test -f dist/index.html && test -f dist/manifest.json && test -d dist/daily
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Owner enables Pages source GitHub Actions first. No enablement or token creation here.
      - id: deployment
        uses: actions/deploy-pages@v4
